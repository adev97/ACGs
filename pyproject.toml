[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kilosort-acgs"
version = "0.1.0"
description = "Firing-rate-normalized autocorrelograms from Kilosort spike sorting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
kilosort-acgs = "acgs.cli:main"

[tool.setuptools.packages.find]
include = ["acgs*"]
